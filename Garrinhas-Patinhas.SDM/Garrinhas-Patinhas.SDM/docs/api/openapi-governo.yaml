openapi: 3.0.3
info:
  title: API Governamental SIMULADA - Registro de animais com microchip
  version: 1.0.0
  description: "Serviço FICTÍCIO para fins acadêmicos. Não é integração oficial. Cabeçalhos: X-API-Key (obrigatório) e Idempotency-Key (recomendado)."
servers: [{url: "http://localhost:8081"}]
components:
  securitySchemes: {apikey: {type: apiKey, in: header, name: X-API-Key}}
security: [{apikey: []}]
paths:
  /api/governo/animais:
    post: {summary: "Cadastra animal", parameters: [{name: Idempotency-Key, in: header, schema: {type: string}}], responses: {"201": {description: Cadastrado + protocolo}, "200": {description: Reenvio idempotente (duplicado=true)}, "409": {description: Microchip já cadastrado}, "422": {description: Dados inválidos}, "503": {description: Indisponível (simulado)}}}
  /api/governo/animais/{microchip}:
    get: {summary: "Consulta animal e vacinações antirrábicas", parameters: [{name: microchip, in: path, required: true, schema: {type: string}}], responses: {"200": {description: ok}, "404": {description: não encontrado}}}
    put: {summary: "Atualiza dados cadastrais", parameters: [{name: microchip, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Atualizado + protocolo}, "404": {description: não encontrado}, "422": {description: inválido}}}
  /api/governo/vacinacoes-antirrabicas:
    post: {summary: "Recebe vacinação antirrábica (idempotente; barra duplicidade por microchip+data+lote)", parameters: [{name: Idempotency-Key, in: header, schema: {type: string}}], responses: {"201": {description: Registrada + protocolo}, "200": {description: "Já registrada (duplicado=true, mesmo protocolo)"}, "422": {description: inválido}, "503": {description: Indisponível}}}
  /api/governo/operacoes/{protocolo}:
    get: {summary: "Consulta operação pelo protocolo", parameters: [{name: protocolo, in: path, required: true, schema: {type: string}}], responses: {"200": {description: ok}, "404": {description: não encontrado}}}
  /api/governo/admin/indisponibilidade:
    get: {summary: "Modo de simulação atual", security: [], responses: {"200": {description: ok}}}
    post: {summary: "'Define o modo: off | 503 | timeout'", security: [], requestBody: {content: {application/json: {schema: {type: object, properties: {modo: {type: string, enum: [off, "503", timeout]}}}}}}, responses: {"200": {description: ok}}}
  /api/governo/health: {get: {summary: "Saúde", security: [], responses: {"200": {description: ok}}}}

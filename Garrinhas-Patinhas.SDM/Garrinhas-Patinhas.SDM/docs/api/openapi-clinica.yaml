openapi: 3.0.3
info: {title: API Privada - Clínica Garrinhas & Patinhas, version: 1.0.0, description: "Autenticação: Bearer JWT (exceto /auth/login, /auth/cadastro, /auth/confirmar, /health)."}
servers: [{url: "http://localhost:8080"}]
components:
  securitySchemes: {bearer: {type: http, scheme: bearer, bearerFormat: JWT}}
  schemas:
    Erro: {type: object, properties: {erro: {type: string}}}
    Endereco: {type: object, required: [cep, logradouro, numero, bairro, cidade, uf], properties: {cep: {type: string}, logradouro: {type: string}, numero: {type: string}, complemento: {type: string}, bairro: {type: string}, cidade: {type: string}, uf: {type: string}, codigo_ibge: {type: string}}}
    TutorIn: {type: object, required: [nome, cpf, data_nascimento, email, telefone, endereco], properties: {nome: {type: string}, cpf: {type: string}, data_nascimento: {type: string, format: date}, email: {type: string}, telefone: {type: string}, endereco: {$ref: "#/components/schemas/Endereco"}}}
    AnimalIn: {type: object, required: [nome, id_tutor, id_especie, sexo], properties: {nome: {type: string}, id_tutor: {type: integer}, id_especie: {type: integer}, id_raca: {type: integer, nullable: true}, sexo: {type: string, enum: [M, F]}, data_nascimento: {type: string, format: date}, idade_estimada_meses: {type: integer}, cor: {type: string}, peso_atual: {type: number}}}
    ConsultaIn: {type: object, required: [id_animal, data_hora, motivo], properties: {id_animal: {type: integer}, data_hora: {type: string, example: "2026-11-23T10:00"}, motivo: {type: string}, anamnese: {type: string}, sintomas: {type: string}, diagnostico: {type: string}, tratamento: {type: string}, prescricao: {type: string}, peso: {type: number}, temperatura: {type: number}, observacoes: {type: string}, status: {type: string, enum: [AGENDADA, REALIZADA, CANCELADA, NAO_COMPARECEU]}}}
    VacinaIn: {type: object, required: [id_animal, nome, tipo, fabricante, lote, data_aplicacao], properties: {id_animal: {type: integer}, nome: {type: string}, tipo: {type: string, enum: [ANTIRRABICA, POLIVALENTE, GRIPE, GIARDIA, OUTRA]}, fabricante: {type: string}, lote: {type: string}, data_aplicacao: {type: string, format: date}, validade_lote: {type: string, format: date}, dose: {type: string}, via_aplicacao: {type: string}, proxima_dose: {type: string, format: date}, status: {type: string, enum: [AGENDADA, APLICADA, CANCELADA]}}}
security: [{bearer: []}]
paths:
  /api/health: {get: {summary: "Saúde do serviço", security: [], responses: {"200": {description: ok}}}}
  /api/auth/cadastro: {post: {summary: "Cadastra veterinário (senha pendente de confirmação)", security: [], responses: {"201": {description: Criado; devolve código simulado}, "409": {description: Duplicado}}}}
  /api/auth/confirmar: {post: {summary: "Confirma a senha com o código", security: [], responses: {"200": {description: Confirmada}, "422": {description: Código inválido}}}}
  /api/auth/login: {post: {summary: "Login por e-mail e senha", security: [], requestBody: {content: {application/json: {schema: {type: object, properties: {email: {type: string}, senha: {type: string}}}}}}, responses: {"200": {description: Token JWT}, "401": {description: Senha incorreta}, "403": {description: Inativo ou senha não confirmada}}}}
  /api/auth/logout: {post: {summary: "Encerra a sessão (revoga token)", responses: {"200": {description: ok}}}}
  /api/auth/me: {get: {summary: "Veterinário logado", responses: {"200": {description: ok}}}}
  /api/cep/{cep}: {get: {summary: "Consulta CEP no ViaCEP", parameters: [{name: cep, in: path, required: true, schema: {type: string}}], responses: {"200": {description: Endereço}, "404": {description: CEP inexistente (preenchimento manual)}, "422": {description: Formato inválido}, "503": {description: ViaCEP indisponível}, "504": {description: Timeout}}}}
  /api/especies: {get: {summary: "Lista espécies", responses: {"200": {description: ok}}}, post: {summary: "Cria espécie", responses: {"201": {description: ok}, "409": {description: Duplicada}}}}
  /api/racas: {get: {summary: "Lista raças (?id_especie)", responses: {"200": {description: ok}}}, post: {summary: "Cria raça", responses: {"201": {description: ok}}}}
  /api/tutores: {get: {summary: "Lista tutores (?q)", responses: {"200": {description: ok}}}, post: {summary: "Cria tutor com endereço", requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/TutorIn"}}}}, responses: {"201": {description: Criado}, "409": {description: CPF duplicado}, "422": {description: Validação (CPF inválido etc.)}}}}
  /api/tutores/{id}: {get: {summary: "Consulta tutor", parameters: [{name: id, in: path, required: true, schema: {type: integer}}], responses: {"200": {description: ok}, "404": {description: não encontrado}}}, put: {summary: "Altera tutor/endereço", parameters: [{name: id, in: path, required: true, schema: {type: integer}}], responses: {"200": {description: ok}}}, delete: {summary: "Inativa tutor (exclusão lógica)", parameters: [{name: id, in: path, required: true, schema: {type: integer}}], responses: {"200": {description: ok}}}}
  /api/animais: {get: {summary: "Lista animais (?id_tutor, ?q)", responses: {"200": {description: ok}}}, post: {summary: "Cadastra animal", requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/AnimalIn"}}}}, responses: {"201": {description: Criado}, "422": {description: "Raça incompatível, tutor inexistente etc."}}}}
  /api/animais/{id}: {get: {summary: "Dados do animal + microchip + situação da integração governamental", parameters: [{name: id, in: path, required: true, schema: {type: integer}}], responses: {"200": {description: ok}}}, put: {summary: "Atualiza animal (e o cadastro no governo)", parameters: [{name: id, in: path, required: true, schema: {type: integer}}], responses: {"200": {description: ok}}}, delete: {summary: "Inativa animal", parameters: [{name: id, in: path, required: true, schema: {type: integer}}], responses: {"200": {description: ok}}}}
  /api/animais/{id}/microchip: {post: {summary: "Vincula ou substitui microchip RFID (veterinário autenticado)", parameters: [{name: id, in: path, required: true, schema: {type: integer}}], requestBody: {content: {application/json: {schema: {type: object, properties: {codigo_microchip: {type: string, example: "076000000000001"}, motivo: {type: string}}}}}}, responses: {"201": {description: Vinculado; cadastro enviado ao governo}, "409": {description: Microchip já utilizado}, "422": {description: Formato inválido}}}}
  /api/animais/{id}/microchips: {get: {summary: "Histórico de microchips", parameters: [{name: id, in: path, required: true, schema: {type: integer}}], responses: {"200": {description: ok}}}}
  /api/consultas: {post: {summary: "Registra consulta", requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/ConsultaIn"}}}}, responses: {"201": {description: Criada}, "422": {description: Validação}}}}
  /api/animais/{id}/consultas: {get: {summary: "Histórico de consultas", parameters: [{name: id, in: path, required: true, schema: {type: integer}}], responses: {"200": {description: ok}}}}
  /api/vacinas: {post: {summary: "Registra vacina. Se antirrábica APLICADA, comunica o governo após gravar localmente", requestBody: {content: {application/json: {schema: {$ref: "#/components/schemas/VacinaIn"}}}}, responses: {"201": {description: "{vacina, comunicacao_governo}"}, "422": {description: Validação / sem microchip}}}}
  /api/vacinas/{id}/aplicar: {patch: {summary: "Marca vacina AGENDADA como APLICADA", parameters: [{name: id, in: path, required: true, schema: {type: integer}}], responses: {"200": {description: ok}}}}
  /api/animais/{id}/vacinas: {get: {summary: "Histórico de vacinação + próximas doses", parameters: [{name: id, in: path, required: true, schema: {type: integer}}], responses: {"200": {description: "{historico, proximas_doses}"}}}}
  /api/integracoes: {get: {summary: "Lista operações de integração (?status, ?id_animal)", responses: {"200": {description: ok}}}}
  /api/integracoes/{id}: {get: {summary: "Consulta uma integração", parameters: [{name: id, in: path, required: true, schema: {type: integer}}], responses: {"200": {description: ok}}}}
  /api/integracoes/{id}/reenviar: {post: {summary: "Reenvio manual (idempotente)", parameters: [{name: id, in: path, required: true, schema: {type: integer}}], responses: {"200": {description: Integração atualizada}}}}
  /api/integracoes/reprocessar-pendentes: {post: {summary: "Reenvia todas as pendentes", responses: {"200": {description: ids reprocessados}}}}

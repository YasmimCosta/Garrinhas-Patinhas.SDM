<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garrinhas & Patinhas · Clínica Veterinária</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🐾 Garrinhas &amp; Patinhas</h1>
  <nav id="nav" hidden>
    <button data-v="tutores">Tutores</button>
    <button data-v="animais">Animais</button>
    <button data-v="integracoes">Integração Governo</button>
    <span id="quem"></span><button id="sair" class="sec">Sair</button>
  </nav>
</header>
<div id="msg" role="alert" hidden></div>

<main>
<!-- LOGIN -->
<section id="v-login" class="card narrow">
  <h2>Acesso do veterinário</h2>
  <form id="f-login">
    <label>E-mail <input name="email" type="email" required value="ana.souza@clinica.test"></label>
    <label>Senha <input name="senha" type="password" required value="Senha@123"></label>
    <button>Entrar</button>
  </form>
  <details><summary>Primeiro acesso / confirmar senha</summary>
    <form id="f-cadastro">
      <label>Nome <input name="nome" required></label>
      <label>CPF <input name="cpf" required></label>
      <div class="row"><label>CRMV <input name="crmv" required></label><label>UF <input name="crmv_uf" maxlength="2" required></label></div>
      <label>E-mail <input name="email" type="email" required></label>
      <label>Senha (mín. 8) <input name="senha" type="password" minlength="8" required></label>
      <button>Cadastrar</button>
    </form>
    <form id="f-confirma">
      <label>E-mail <input name="email" type="email" required></label>
      <label>Código recebido (simulado) <input name="codigo" required></label>
      <button>Confirmar senha</button>
    </form>
  </details>
</section>

<!-- TUTORES -->
<section id="v-tutores" hidden>
  <div class="card"><h2 id="t-form-titulo">Novo tutor</h2>
    <form id="f-tutor">
      <div class="row"><label>Nome completo <input name="nome" required></label><label>CPF <input name="cpf" required></label></div>
      <div class="row"><label>Nascimento <input name="data_nascimento" type="date" required></label>
        <label>Telefone <input name="telefone" required></label><label>E-mail <input name="email" type="email" required></label></div>
      <div class="row"><label>CEP <input name="cep" maxlength="9" required></label>
        <button type="button" id="b-cep" class="sec">Buscar CEP</button></div>
      <div class="row"><label>Logradouro <input name="logradouro" required></label><label>Nº <input name="numero" required></label>
        <label>Complemento <input name="complemento"></label></div>
      <div class="row"><label>Bairro <input name="bairro" required></label><label>Cidade <input name="cidade" required></label>
        <label>UF <input name="uf" maxlength="2" required></label><label>IBGE <input name="codigo_ibge"></label></div>
      <label id="l-situacao" hidden>Situação do cadastro
        <select name="situacao"><option value="ATIVO">Ativo</option><option value="INATIVO">Inativo</option></select></label>
      <div class="row"><button id="b-salvar-tutor">Salvar tutor</button>
        <button type="button" id="b-cancelar" class="sec" hidden>Cancelar edição</button></div>
    </form>
  </div>
  <div class="card" id="detalhe-tutor" hidden></div>
  <div class="card"><h2>Tutores <small>(clique em um tutor para ver todos os dados)</small></h2><div class="scroll"><table id="t-tutores"></table></div></div>
</section>

<!-- ANIMAIS -->
<section id="v-animais" hidden>
  <div class="card"><h2>Novo animal</h2>
    <form id="f-animal">
      <div class="row"><label>Nome <input name="nome" required></label><label>Tutor <select name="id_tutor" required></select></label></div>
      <div class="row"><label>Espécie <select name="id_especie" required></select></label>
        <label>Raça <select name="id_raca"></select></label>
        <label>Sexo <select name="sexo"><option value="M">Macho</option><option value="F">Fêmea</option></select></label></div>
      <div class="row"><label>Nascimento <input name="data_nascimento" type="date"></label>
        <label>ou idade estimada (meses) <input name="idade_estimada_meses" type="number" min="0"></label>
        <label>Cor <input name="cor"></label><label>Peso (kg) <input name="peso_atual" type="number" step="0.01" min="0.01"></label></div>
      <button>Salvar animal</button>
    </form>
  </div>
  <div class="card"><h2>Animais</h2><div class="scroll"><table id="t-animais"></table></div></div>
  <div class="card" id="detalhe" hidden></div>
</section>

<!-- INTEGRAÇÕES -->
<section id="v-integracoes" hidden>
  <div class="card"><h2>Simulador do serviço governamental</h2>
    <p>Estado atual: <strong id="gov-modo">—</strong></p>
    <div class="row">
      <button data-gov="off" class="ok">Disponível</button>
      <button data-gov="503" class="warn">Indisponível (503)</button>
      <button data-gov="timeout" class="warn">Lento (timeout)</button>
      <button id="b-reproc">Reenviar pendências</button>
    </div>
  </div>
  <div class="card"><h2>Operações de integração <small>(microchip e CPF do tutor enviados ao governo)</small></h2>
    <div class="row"><label>Filtrar <select id="f-status"><option value="">Todas</option><option>PENDENTE</option>
      <option>ENVIADA</option><option>CONFIRMADA</option><option>FALHA</option></select></label></div>
    <div class="scroll"><table id="t-integ"></table></div>
  </div>
</section>
</main>
<script src="app.js"></script>
</body>
</html>
